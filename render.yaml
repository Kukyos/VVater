services:
  - type: web
    name: vvater-api
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.ocean.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_ROUTER_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        sync: false
      - key: PYTHON_VERSION
        value: 3.14.0
      # glibc gives each thread its own memory arena; with 32 zarr reader threads that
      # inflated the process towards the free plan's 512 MB. Two arenas is plenty here.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # 32 reader threads each hold a chunk in flight; 8 is slower per cube but fits 512 MB.
      - key: ZARR_CONCURRENCY
        value: "8"
