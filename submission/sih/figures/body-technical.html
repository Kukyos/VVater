    <svg width="2260" height="1560" viewBox="0 0 2260 1560"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4F5B69"/></marker></defs><rect x="0" y="0" width="900" height="170" fill="#F1F4F8" stroke="#1F4E79" stroke-width="3"/><rect x="0" y="0" width="10" height="170" fill="#1F4E79"/><text x="30" y="50" font-size="40" font-weight="600" fill="#16202B">1  You ask: box · day · variable</text><text x="30" y="96" font-size="34" fill="#4F5B69">anywhere; 23 variables, 17 of them from 1993</text><text x="30" y="138" font-size="34" fill="#4F5B69">by hand, by a named scenario, or by the assistant</text><polyline points="450.0,170 450.0,214" fill="none" stroke="#4F5B69" stroke-width="3.5" marker-end="url(#a)"/><polygon points="450.0,214.0 730.0,306 450.0,398.0 170.0,306" fill="#FFF8E6" stroke="#B9770E" stroke-width="3"/><text x="450.0" y="296" font-size="35" font-weight="600" text-anchor="middle" fill="#16202B">Reanalysis covers</text><text x="450.0" y="340" font-size="35" font-weight="600" text-anchor="middle" fill="#16202B">that day?</text><polyline points="730.0,306 950,306" fill="none" stroke="#B9770E" stroke-width="3.5" marker-end="url(#a)"/><text x="750.0" y="292" font-size="34" font-weight="600" fill="#B9770E">no</text><rect x="950" y="238" width="560" height="136" fill="#FEF5E7" stroke="#B9770E" stroke-width="3"/><rect x="950" y="238" width="10" height="136" fill="#B9770E"/><text x="980" y="288" font-size="40" font-weight="600" fill="#16202B">Analysis & forecast</text><text x="980" y="334" font-size="34" fill="#4F5B69">labelled forecast on screen</text><polyline points="1230,374 1230,420 510.0,420 510.0,446" fill="none" stroke="#4F5B69" stroke-width="3.5" marker-end="url(#a)"/><polyline points="450.0,398 450.0,446" fill="none" stroke="#4F5B69" stroke-width="3.5" marker-end="url(#a)"/><text x="370.0" y="432" font-size="34" font-weight="600" fill="#4F5B69">yes</text><rect x="0" y="4 " fill="#2E86C1"/><rect x="1130" y="630" width="36" height="36" fill="#E6ECF3"/><rect x="1170" y="470" width="36" height="36" fill="#E6ECF3"/><rect x="1170" y="510" width="36" height="36" fill="#2E86C1"/><rect x="1170" y="550" width="36" height="36" fill="#2E86C1"/><rect x="1170" y="590" width="36" height="36" fill="#2E86C1"/><rect x="1170" y="630" width="36" height="36" fill="#E6ECF3"/><rect x="1210" y="470" width="36" height="36" fill="#E6ECF3"/><rect x="1210" y="510" width="36" height="36" fill="#2E86C1"/><rect x="1210" y="550" width="36" height="36" fill="#2E86C1"/><rect x="1210" y="590" width="36" height="36" fill="#2E86C1"/><rect x="1210" y="630" width="36" height="36" fill="#E6ECF3"/><rect x="1250" y="470" width="36" height="36" fill="#E6ECF3"/><rect x="1250" y="510" width="36" height="36" fill="#E6ECF3"/><rect x="1250" y="550" width="36" height="36" fill="#E6ECF3"/><rect x="1250" y="590" width="36" height="36" fill="#E6ECF3"/><rect x="1250" y="630" width="36" height="36" fill="#E6ECF3"/><rect x="1290" y="470" width="36" height="36" fill="#E6ECF3"/><rect x="1290" y="510" width="36" height="36" fill="#E6ECF3"/><rect x="1290" y="550" width="36" height="36" fill="#E6ECF3"/><rect x="1290" y="590" width="36" height="36" fill="#E6ECF3"/><rect x="1290" y="630" width="36" height="36" fill="#E6ECF3"/><rect x="1330" y="470" width="36" height="36" fill="#E6ECF3"/><rect x="1330" y="510" width="36" height="36" fill="#E6ECF3"/><rect x="1330" y="550" width="36" height="36" fill="#E6ECF3"/><rect x="1330" y="590" width="36" height="36" fill="#E6ECF3"/><rect x="1330" y="630" width="36" height="36" fill="#E6ECF3"/><rect x="1106" y="520" width="126" height="92" fill="none" stroke="#C0392B" stroke-width="5"/><text x="970" y="704" font-size="32" fill="#4F5B69"><tspan fill="#C0392B" font-weight="600">box</tspan> · <tspan fill="#2E86C1" font-weight="600">chunks read</tspan></text><polyline points="450.0,656 450.0,700" fill="none" stroke="#4F5B69" stroke-width="3.5" marker-end="url(#a)"/><polygon points="450.0,700.0 730.0,792 450.0,884.0 170.0,792" fill="#FFF8E6" stroke="#B9770E" stroke-width="3"/><text x="450.0" y="782" font-size="35" font-weight="600" text-anchor="middle" fill="#16202B">Published range</text><text x="450.0" y="826" font-size="35" font-weight="600" text-anchor="middle" fill="#16202B">for this variable?</text><polyline points="730.0,792 950,792" fill="none" stroke="#C0392B" stroke-width="3.5" marker-end="url(#a)"/><text x="746.0" y="778" font-size="34" font-weight="600" fill="#C0392B">fails</text><rect x="950" y="724" width="560" height="136" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/><rect x="950" y="724" width="10" height="136" fill="#C0392B"/><text x="980" y="774" font-size="40" font-weight="600" fill="#16202B">Masked and counted</text><text x="980" y="820" font-size="34" fill="#4F5B69">in the provenance panel</text><polyline points="450.0,884 450.0,928" fill="none" stroke="#4F5B69" stroke-width="3.5" marker-end="url(#a)"/><text x="466.0" y="914" font-size="34" font-weight="600" fill="#4F5B69">passes, or none published</text><rect x="0" y="928" width="900" height="210" fill="#F1F4F8" stroke="#1F4E79" stroke-width="3"/><rect x="0" y="928" width="10" height="210" fill="#1F4E79"/><text x="30" y="978" font-size="40" font-weight="600" fill="#16202B">3  Native depth levels, never more</text><text x="30" y="1024" font-size="34" fill="#4F5B69">block-averaged across to ≤160 cells a side;</text><text x="30" y="1066" font-size="34" fill="#4F5B69">TEOS-10 density and speed of sound;</text><text x="30" y="1108" font-size="34" fill="#4F5B69">sent as raw float32</text><polyline points="450.0,1138 450.0,1182" fill="none" stroke="#4F5B69" stroke-width="3.5" marker-end="url(#a)"/><rect x="0" y="1182" width="900" height="124" fill="#F1F4F8" stroke="#1F4E79" stroke-width="3"/><rect x="0" y="1182" width="10" height="124" fill="#1F4E79"/><text x="30" y="1232" font-size="40" font-weight="600" fill="#16202B">4  Browser: CesiumJS paints six faces</text><text x="30" y="1278" font-size="34" fill="#4F5B69">each face a section; cut any side inwards</text><rect x="1620" y="0" width="640" height="170" fill="#EAF2FB" stroke="#2E86C1" stroke-width="3"/><rect x="1620" y="0" width="10" height="170" fill="#2E86C1"/><text x="1650" y="50" font-size="40" font-weight="600" fill="#16202B">Floats in the box</text><text x="1650" y="96" font-size="34" fill="#4F5B69">Ifremer Argo ERDDAP,</text><text x="1650" y="138" font-size="34" fill="#4F5B69">core and BGC, ±2 days</text><polyline points="1940.0,170 1940.0,214" fill="none" stroke="#4F5B69" stroke-width="3.5" marker-end="url(#a)"/><polygon points="1940.0,214.0 2220.0,306 1940.0,398.0 1660.0,306" fill="#FFF8E6" stroke="#B9770E" stroke-width="3"/><text x="1940.0" y="296" font-size="35" font-weight="600" text-anchor="middle" fill="#16202B">Level passes</text><text x="1940.0" y="340" font-size="35" font-weight="600" text-anchor="middle" fill="#16202B">its QC flag?</text><polyline points="1940.0,398 1940.0,446" fill="none" stroke="#C0392B" stroke-width="3.5" marker-end="url(#a)"/><text x="1956.0" y="432" font-size="34" font-weight="600" fill="#C0392B">no</text><rect x="1620" y="446" width="640" height="136" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/><rect x="1620" y="446" width="10" height="136" fill="#C0392B"/><text x="1650" y="496" font-size="40" font-weight="600" fill="#16202B">Drawn red</text><text x="1650" y="542" font-size="34" fill="#4F5B69">kept, never dropped</text><polyline points="1940.0,582 1940.0,700" fill="none" stroke="#C0392B" stroke-width="3.5" marker-end="url(#a)"/><text x="1956.0" y="650" font-size="34" font-weight="600" fill="#C0392B">kept</text><polyline points="1660.0,306 1600,306 1600,700 1620,700" fill="none" stroke="#4F5B69" stroke-width="3.5" marker-end="url(#a)"/><text x="1530" y="290" font-size="34" font-weight="600" fill="#4F5B69">yes</text><rect x="1620" y="700" width="640" height="210" fill="#EAF2FB" stroke="#2E86C1" stroke-width="3"/><rect x="1620" y="700" width="10" height="210" fill="#2E86C1"/><text x="1650" y="750" font-size="40" font-weight="600" fill="#16202B">Stick in the cube</text><text x="1650" y="796" font-size="34" fill="#4F5B69">on the cube's colour bar;</text><text x="1650" y="838" font-size="34" fill="#4F5B69">click: compared with the</text><text x="1650" y="880" font-size="34" fill="#4F5B69">model on its own day</text><polyline points="1940.0,910 1940.0,1182 908,1244" fill="none" stroke="#4F5B69" stroke-width="3.5" marker-end="url(#a)"/><rect x="0" y="1440" width="2260" height="110" fill="#1F4E79" stroke="#1F4E79" stroke-width="3"/><rect x="0" y="1440" width="10" height="110" fill="#1F4E79"/><text x="30" y="1490" font-size="40" font-weight="600" fill="#16202B"></text><text x="30" y="1510" font-size="40" font-weight="600" fill="#FFFFFF">5  On screen<tspan font-weight="400" fill="#CFE3F5">   Region 3D · Map 2D · Globe · Fly · Immersive · Learn · Assistant</tspan></text><polyline points="450.0,1306 450.0,1440" fill="none" stroke="#4F5B69" stroke-width="3.5" marker-end="url(#a)"/></svg>

  <div class="col" style="gap:14px">
    <h2 style="margin:0">Technologies to be used</h2>
    <svg width="1430" height="1560" viewBox="0 0 1430 1560"><defs><marker id="b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4F5B69"/></marker></defs><rect x="0" y="0" width="1430" height="400" fill="#EAF2FB" stroke="#2E86C1" stroke-width="3"/><rect x="0" y="0" width="12" height="400" fill="#2E86C1"/><text x="36" y="54" font-size="42" font-weight="600" fill="#16202B">Browser<tspan font-size="33" font-weight="400" fill="#4F5B69">  any modern browser, nothing installed</tspan></text><text x="36" y="116" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">CesiumJS 26</tspan>  3D globe, voxel volume, the cube's faces</text><text x="36" y="176" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">TypeScript 5.9 + Vite 7</tspan>  the viewer, no UI framework</text><text x="36" y="236" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">Canvas 2D overlay</tspan>  currents and winds as moving particles</text><text x="36" y="296" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">Cesium ion (optional)</tspan>  world terrain and imagery for Fly</text><text x="36" y="356" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">Static files</tspan>  served from any web host (Vercel today)</text><line x1="120" x2="120" y1="406" y2="492" stroke="#4F5B69" stroke-width="4" marker-start="url(#b)" marker-end="url(#b)"/><text x="160" y="460" font-size="33" font-weight="600" fill="#4F5B69">REST: JSON, raw float32 volumes, OGC WMS (Bay layers)</text><rect x="0" y="498" width="1430" height="560" fill="#F1F4F8" stroke="#1F4E79" stroke-width="3"/><rect x="0" y="498" width="12" height="560" fill="#1F4E79"/><text x="36" y="552" font-size="42" font-weight="600" fill="#16202B">API server<tspan font-size="33" font-weight="400" fill="#4F5B69">  one Python 3.14 process</tspan></text><text x="36" y="614" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">FastAPI + Uvicorn</tspan>  cubes, floats, surface, wind, fishing, chat</text><text x="36" y="674" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">xarray · netCDF4 · dask</tspan>  NetCDF and zarr, read lazily</text><text x="36" y="734" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">numpy · scipy · gsw</tspan>  regrid, streamlines, TEOS-10 seawater</text><text x="36" y="794" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">Copernicus toolbox + S3</tspan>  only the chunks a request needs</text><text x="36" y="854" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">Disk chunk cache</tspan>  measured 639 MB peak RAM; ask for 1 GB</text><text x="36" y="914" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">LLM via AIRouter</tspan>  tools call our own API, nothing else</text><text x="36" y="974" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">truststore</tspan>  TLS always verified, against the OS store</text><line x1="120" x2="120" y1="1064" y2="1150" stroke="#4F5B69" stroke-width="4" marker-start="url(#b)" marker-end="url(#b)"/><text x="160" y="1118" font-size="33" font-weight="600" fill="#4F5B69">HTTPS only, no credentials for the defaults</text><rect x="0" y="1156" width="1430" height="404" fill="#FEF5E7" stroke="#B9770E" stroke-width="3"/><rect x="0" y="1156" width="12" height="404" fill="#B9770E"/><text x="36" y="1210" font-size="42" font-weight="600" fill="#16202B">Data, fetched on demand<tspan font-size="33" font-weight="400" fill="#4F5B69">  nothing copied in advance</tspan></text><text x="36" y="1272" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">Copernicus Marine</tspan>  ARCO zarr on S3: physics, biogeochemistry, waves</text><text x="36" y="1332" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">ERDDAP</tspan>  INCOIS analysis · Ifremer Argo · IOOS gliders</text><text x="36" y="1392" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">INCOIS PFZ</tspan>  fishing advisories, as published</text><text x="36" y="1452" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">UCAR THREDDS · NASA GIBS</tspan>  GFS wind forecast · land relief</text><text x="36" y="1512" font-size="37" fill="#4F5B69"><tspan font-weight="600" fill="#1F4E79">Open-Meteo</tspan>  place names for the course</text></svg>
